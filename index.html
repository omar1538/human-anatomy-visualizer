<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Human Anatomy Visualizer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f1520;
        color: #e8edf5;
        font-family: system-ui, sans-serif;
      }
      #viewer {
        position: fixed;
        inset: 0;
      }
      #viewer canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="viewer"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
