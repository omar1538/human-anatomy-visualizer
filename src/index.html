<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Human Anatomy Visualizer</title>
    <meta
      name="description"
      content="Interactive 3D anatomy learning platform. Educational use only."
    />
    <meta name="theme-color" content="#0f1520" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Anatomy" />
    <!-- vite-ignore: published unchanged at these paths (see vite.config.mjs), not renamed by the build -->
    <link rel="manifest" href="./manifest.webmanifest" vite-ignore />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" vite-ignore />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" vite-ignore />
    <!-- Module scripts are deferred: main.mjs runs after the page is parsed, so #viewer exists. -->
    <script type="module" src="./scripts/main.mjs"></script>
    <link rel="stylesheet" href="./styles/base.css" />
  </head>
  <body>
    <div id="viewer"></div>
  </body>
</html>
