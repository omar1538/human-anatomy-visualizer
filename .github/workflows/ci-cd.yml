# CI/CD: checks every push and pull request on main; deploys to GitHub Pages only after a push
# to main whose CI passed.
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; the deploy job asks for the Pages permissions it needs.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the CI still running for the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI (install, lint, validate, GLB size, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The data validator is a standard-library Python script (no pip install needed).
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      # Automated tests in tests/ (Node's built-in runner): selection, AR placement,
      # organs.json loading, slicing, and which heart.glb structures can show a filled cut.
      # The job name above is unchanged on purpose: the branch protection rule requires it.
      - name: Test (npm test)
        run: npm test

      # Every GLB node has an organs.json record with EN/FR texts, a licence and an attribution
      # (author) in the GLB; the GLB exists; quiz.json is consistent. See docs/DATA_CONTRACT.md.
      - name: Validate data (organs.json, quiz.json, heart.glb)
        run: npm run validate

      - name: Fail if a .glb file is larger than 5 MB
        run: |
          limit=$((5 * 1024 * 1024))
          status=0
          while IFS= read -r -d '' file; do
            size=$(stat -c %s "$file")
            printf '%10d bytes  %s\n' "$size" "$file"
            if [ "$size" -gt "$limit" ]; then
              echo "::error file=$file::$file is $size bytes, above the 5 MB limit ($limit bytes)"
              status=1
            fi
          done < <(git ls-files -z '*.glb')
          exit $status

      - name: Build
        run: npm run build

      # Only for a push to main: hand the exact build that passed the checks to the deploy job.
      - name: Upload the site for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: CD (deploy to GitHub Pages)
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # One deployment at a time; a newer one waits instead of cancelling a deployment in progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
